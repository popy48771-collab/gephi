<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>APJ Rolling Windows (Gephi Lite)</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 10px 12px; border-bottom: 1px solid #ddd; display:flex; gap:12px; align-items:center; }
    select { padding: 6px 8px; }
    iframe { width: 100vw; height: calc(100vh - 52px); border: 0; }
    .hint { color:#666; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>Window</strong>
    <select id="win"></select>
    <span class="hint">同じビューで切替（Gephi Liteを埋め込み）</span>
  </header>

  <iframe id="viz" referrerpolicy="no-referrer"></iframe>

  <script>
    const sel = document.getElementById("win");
    const iframe = document.getElementById("viz");

    // このページ（index.html）が置かれている場所を基準にする
    const base = location.origin + location.pathname.replace(/\/[^\/]*$/, "/");

    async function init() {
      // windows.json を読み込む
      const res = await fetch(base + "windows.json", { cache: "no-store" });
      if (!res.ok) {
        alert("windows.json が読めません: " + res.status);
        return;
      }
      const items = await res.json();

      // プルダウンを生成
      for (const it of items) {
        const opt = document.createElement("option");
        opt.value = base + it.file;     // GEXFの公開URLにする
        opt.textContent = it.label;
        sel.appendChild(opt);
      }

      // 最初の窓を表示
      loadSelected();
    }

    function loadSelected() {
      const fileUrl = encodeURIComponent(sel.value);
      iframe.src = "https://lite.gephi.org/?file=" + fileUrl;
    }

    sel.addEventListener("change", loadSelected);
    init();
  </script>
</body>
</html>
